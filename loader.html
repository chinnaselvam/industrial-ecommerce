<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stackly Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0d1726, #101c2c 40%, #16283a 100%);
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .loader-wrap {
        width: min(100%, 480px);
        text-align: center;
        padding: 26px;
      }
      .brand-box {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-size: 2.1rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        margin-bottom: 30px;
      }
      .gear {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle, rgba(255,255,255,0.1), rgba(255,107,36,0.28));
        border: 2px solid rgba(255, 107, 36, 0.7);
        box-shadow: 0 0 25px rgba(255, 107, 36, 0.3);
        animation: pulse 1.8s infinite ease-in-out;
      }
      .gear i {
        font-size: 2.2rem;
        color: #ff6b24;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      .tagline {
        font-size: 0.8rem;
        letter-spacing: 0.22em;
        color: rgba(255,255,255,0.85);
        text-transform: uppercase;
        margin-bottom: 28px;
      }
      .progress-track {
        width: 100%;
        height: 12px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ff8b56, #ff6b24);
        border-radius: inherit;
        transition: width 0.25s ease;
      }
      .loading-state {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 14px;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.72);
      }
    </style>
  </head>
  <body>
    <div class="loader-wrap">
      <div class="brand-box">
        <span class="gear"><i class="fa-solid fa-gear"></i></span>
        <span>Stackly</span>
      </div>
      <div class="tagline">Powering Industry. Building The Future.</div>
      <div class="progress-track"><div class="progress-bar" id="loadingProgress"></div></div>
      <div class="loading-state"><span>Loading</span><span id="loadingText">0%</span></div>
    </div>

    <script src="assets/js/loader.js"></script>
  </body>
</html>
